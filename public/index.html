<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1524" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pulse" />
  <title>Pulse</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <script>
    // Aplica o tema salvo antes do CSS pintar a tela, pra não piscar a cor errada.
    (function () {
      try {
        var t = localStorage.getItem('pulse_theme');
        if (t && t !== 'blue') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css?v=8" />
</head>
<body>
  <div id="app"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="lightbox" class="lightbox" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/utils.js?v=8"></script>
  <script src="/js/ui.js?v=8"></script>
  <script src="/js/api.js?v=8"></script>
  <script src="/js/app.js?v=8"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
