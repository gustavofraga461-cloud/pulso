<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Chat</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="auth-screen">
        <h2>Bem-vindo ao Pulse</h2>
        <input type="text" id="myUsername" placeholder="Seu nome de usuário">
        <button onclick="app.login()">Entrar</button>
    </div>
    
    <div id="chat-app" style="display: none;">
        <div class="tabs">
            <button onclick="ui.showTab('conversas')">Conversas Ativas</button>
            <button onclick="ui.showTab('solicitacoes')" id="btn-solicitacoes">Solicitações <span id="req-badge">0</span></button>
        </div>

        <div id="conversas" class="tab-content active">
            <div id="chat-list" class="messages-container"></div>
            <div class="input-area">
                <input type="text" id="receiver" placeholder="Para quem quer enviar?">
                <input type="text" id="msgText" placeholder="Digite sua mensagem">
                <button onclick="app.sendMessage()">Enviar</button>
            </div>
        </div>

        <div id="solicitacoes" class="tab-content" style="display: none;">
            <h3>Novas solicitações</h3>
            <div id="request-list"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
